[package]
name = "word-collector"
version = "0.1.0"
description = "选中英文单词，全局快捷键一键追加到 Obsidian Markdown 词库"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS 平台能力（CGEvent 键盘模拟 / AXIsProcessTrusted / 托盘策略切换）全部通过
# 手写 FFI 链接系统框架完成，不引入额外 crate。

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser", "windef", "minwindef", "basetsd"] }
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
